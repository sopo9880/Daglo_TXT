name: Build and release Windows app
on:
  push:
    branches: [main]
    paths: [version.py, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install installer compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Compiler signature invalid' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $setup -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $compiler + '"')) -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$compiler/ISCC.exe")) { throw 'Compiler setup failed' }
          "DAGLO_ISCC=$compiler/ISCC.exe" >> $env:GITHUB_ENV
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1 -ISCC $env:DAGLO_ISCC
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from version import APP_VERSION; print(APP_VERSION)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Increment version.py to publish a new update."
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Daglo TXT $tag" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
