name: Build and release Windows app
on:
  push:
    branches: [main]
    paths: [version.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Build and verify
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from version import APP_VERSION; print(APP_VERSION)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Increment version.py to publish a new update."
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Daglo TXT $tag" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false --latest
